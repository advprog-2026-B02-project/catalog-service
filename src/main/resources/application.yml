spring:
  application:
    name: bidmart-catalog
  datasource:
    url: ${CATALOG_DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/bidmart_catalog}}
    username: ${CATALOG_DB_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${CATALOG_DB_PASSWORD:${DATABASE_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: catalog-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "id.ac.ui.cs.advprog.bidmart.catalog.event"
        spring.json.use.type.headers: false
        spring.json.value.default.type: "id.ac.ui.cs.advprog.bidmart.catalog.event.BidPlacedEvent"

server:
  port: ${SERVER_PORT:8083}

app:
  base-url: ${APP_BASE_URL:http://localhost:8083}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  service-token: ${INTERNAL_SERVICE_TOKEN:${SERVICE_TOKEN:internal-service-secret}}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:bidmart_catalog_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
