services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: catalog-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - catalog-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: catalog-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - catalog-network

  catalog-db:
    image: postgres:16-alpine
    container_name: catalog-postgres
    environment:
      POSTGRES_DB: bidmart_catalog
      POSTGRES_USER: ${CATALOG_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - catalog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - catalog-network

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-mugmold}/bidmart-catalog-service:latest
    container_name: bidmart-catalog-app
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      CATALOG_DB_URL: jdbc:postgresql://catalog-db:5432/bidmart_catalog
      CATALOG_DB_USERNAME: ${CATALOG_DB_USERNAME:-postgres}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-internal-service-secret}
      APP_BASE_URL: http://catalog-service:8083
      APP_FRONTEND_URL: http://localhost:3000
    depends_on:
      kafka:
        condition: service_healthy
      catalog-db:
        condition: service_healthy
    networks:
      - catalog-network

volumes:
  catalog-postgres-data:

networks:
  catalog-network:
    driver: bridge
